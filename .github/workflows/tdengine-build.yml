name: TDengine Build

on:
  push:
    branches:
      - 'freemine.matrix'

    paths-ignore:
      - 'docs/**'
      - 'packaging/**'
      - 'tests/**'
      - '**/*.md'
      - 'test/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Run on ${{ matrix.os }} with ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-13, macos-14, macos-15, windows-2022]
        build_type: [Debug, Release]
    env:
      TD_CONFIG: ${{ matrix.build_type}}

    steps:
      - name: Get CPU Cores
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            CPU_CORES=$(nproc)
          elif [ "${{ runner.os }}" == "macOS" ]; then
            CPU_CORES=$(sysctl -n hw.ncpu)
          elif [ "${{ runner.os }}" == "Windows" ]; then
            CPU_CORES=$(powershell -Command "(Get-CimInstance -ClassName Win32_Processor).NumberOfCores")
          fi
          echo "CPU Cores: $CPU_CORES"
          echo "CPU_CORES=$CPU_CORES" >> $GITHUB_ENV

      - name: Dump CPU Cores
        run: |
          echo "The number of CPU cores is: ${{ env.CPU_CORES }}"

      - if: runner.os == 'macOS'
        name: prepare install path
        run: |
          sudo mkdir -p /usr/local/lib
          sudo mkdir -p /usr/local/include

      - name: Checkout the repository
        uses: actions/checkout@v4

      - if: runner.os != 'Windows'
        name: Cache Go modules on Linux and macOS
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - if: runner.os == 'macOS'
        name: Cache Homebrew on macOS
        uses: actions/cache@v3
        with:
          path: /usr/local/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - if: runner.os == 'Windows'
        name: Cache Go modules on Windows
        uses: actions/cache@v3
        with:
          path: |
            C:\Users\runneradmin\go\pkg\mod
            C:\Users\runneradmin\AppData\Local\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - if: runner.os == 'Linux'
        name: Install dependencies on Linux
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential \
            cmake \
            gawk \
            libgeos-dev \
            libjansson-dev \
            liblzma-dev \
            libsnappy-dev \
            libssl-dev \
            libz-dev \
            pkg-config \
            zlib1g

      - if: runner.os == 'macOS'
        name: Install dependencies on macOS
        run: |
          brew update
          brew install \
            argp-standalone \
            gawk \
            gflags \
            geos \
            jansson \
            openssl \
            pkg-config \
            snappy \
            zlib

      - if: runner.os == 'Windows'
        name: Install dependencies on Windows
        run: |
          choco install jom --yes

      - name: Show software version
        run: |
          cmake --version

      - name: Get CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6

      - name: Cache externals built
        uses: actions/cache@v4
        id: cache-ext
        with:
          path: ${{ github.workspace }}/.externals
          key: ${{ runner.os }}-${{ matrix.os }}-${{ matrix.build_type }}-${{ hashFiles('cmake/external.cmake', 'cmake/in/**') }}-build-ext-v3 # this is tailing cache-version-tick

      - if: ${{ steps.cache-ext.outputs.cache-hit != 'true' && runner.os != 'Windows' }}
        name: Build externals on ${{ matrix.os }} with ${{ matrix.build_type }}
        continue-on-error: false
        run: |
          echo ${TD_CONFIG}
          ./build.sh gen
          ./build.sh bld --target build_externals -v

      - if: ${{ steps.cache-ext.outputs.cache-hit != 'true' && runner.os == 'Windows' }}
        name: Build externals on ${{ matrix.os }} with ${{ matrix.build_type }}
        continue-on-error: false
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set CL=/MP8
          echo %CL%
          echo %TD_CONFIG%
          call .\build.bat gen -G "NMake Makefiles JOM"
          call .\build.bat bld --target build_externals -v

      - if: runner.os != 'Windows'
        name: Build TDengine on ${{ matrix.os }} with ${{ matrix.build_type }}
        run: |
          echo ${TD_CONFIG}
          ./build.sh gen -DTD_EXTERNALS_USE_ONLY:BOOL=ON
          ./build.sh bld -v
          ./build.sh install
          which taosd
          which taosadapter
          which taoskeeper
          which taos
          taosd --help
          taosadapter --help

      - if: runner.os == 'Windows'
        name: Build TDengine on ${{ matrix.os }} with ${{ matrix.build_type }}
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set CL=/MP8
          echo %CL%
          echo %TD_CONFIG%
          call .\build.bat gen -DTD_EXTERNALS_USE_ONLY:BOOL=ON -G "NMake Makefiles JOM"
          call .\build.bat bld -v
          call .\build.bat install
          echo %PATH%
          dir C:\TDengine
          set PATH=%PATH%;C:\TDengine
          echo %PATH%
          where taos.exe
          where taosd.exe
          where taosadapter.exe
          where taoskeeper.exe
          taosd.exe --help
          taosadapter.exe --help

      - if: runner.os == 'Linux'
        name: Statistics on ${{ matrix.os }} with ${{ matrix.build_type }}
        run: |
          find ${{ github.workspace }}/debug/build/lib -type f -name "*.so" -print0 | xargs -0 ldd || true
          find ${{ github.workspace }}/debug/build/bin -type f -print0 | xargs -0 ldd || true

      - if: runner.os == 'macOS'
        name: Statistics on ${{ matrix.os }} with ${{ matrix.build_type }}
        run: |
          find ${{ github.workspace }}/debug/build/lib -type f -name "*.dylib" -print0 | xargs -0 otool -L || true
          find ${{ github.workspace }}/debug/build/bin -type f -print0 | xargs -0 otool -L || true

      - if: runner.os != 'Windows'
        name: Start taosd on ${{ matrix.os }} with ${{ matrix.build_type }}
        run: |
          taosd -V
          taosadapter -V
          taosBenchmark -V
          taos -V
          ./build.sh start
          pgrep -l taos
          sleep 6     # NOTE: wait for taosd initialization to complete
          pgrep -l taos
          taos -s "show databases"
          taos -s "show dnodes"

      - if: runner.os != 'Windows'
        name: Run tests with taosBenchmark on ${{ matrix.os }} with ${{ matrix.build_type }}
        run: |
          taos -s "show databases"
          taosBenchmark -t 10 -n 10 -s 1744951233012 -y
          taos -s "select count(*) from test.meters"

      - if: runner.os != 'Windows'
        name: Clean up on ${{ matrix.os }} with ${{ matrix.build_type }}
        run: |
          ./build.sh stop

